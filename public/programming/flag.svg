<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="发光终点旗">
  <defs>
    <linearGradient id="wood" x1="24" x2="34" y1="14" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C48A45"/>
      <stop offset=".48" stop-color="#9A6A2F"/>
      <stop offset="1" stop-color="#6B421C"/>
    </linearGradient>
    <linearGradient id="cloth" x1="31" x2="78" y1="18" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF2A9"/>
      <stop offset=".48" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="flagGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FACC15" flood-opacity=".65"/>
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
    <style>
      @keyframes flag-wave {
        from { transform: translateX(0) skewY(0deg); }
        to { transform: translateX(1px) skewY(-2deg); }
      }
      .flag-cloth { animation: flag-wave 1.6s ease-in-out infinite alternate; transform-origin: 30px 24px; }
    </style>
  </defs>
  <ellipse cx="30" cy="84" rx="18" ry="5" fill="#0F172A" opacity=".14"/>
  <path d="M28 15v67" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M28 15v67" fill="none" stroke="url(#wood)" stroke-width="6" stroke-linecap="round"/>
  <path d="M31 18c12-5 24 7 36 2 6-2 10-1 13 2v31c-4-4-10-4-16-2-12 5-22-6-33-1V18Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" class="flag-cloth"/>
  <path d="M31 18c12-5 24 7 36 2 6-2 10-1 13 2v31c-4-4-10-4-16-2-12 5-22-6-33-1V18Z" fill="url(#cloth)" stroke="#A96800" stroke-width="3.5" stroke-linejoin="round" class="flag-cloth"/>
  <path d="M38 23c8-1 14 5 23 4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".55" class="flag-cloth"/>
  <path d="M30 7l4 8 9 2-7 6 1 9-7-5-8 5 2-9-7-6 9-2 4-8Z" fill="#FACC15" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" filter="url(#flagGlow)"/>
